// Top-level build file

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    // قيم flutter.* التي تعتمد عليها بعض الإضافات القديمة (مثل app_links)
    flutter = [
            compileSdkVersion: 35,
            minSdkVersion    : 24,
            targetSdkVersion : 35,
            ndkVersion       : "27.0.12077973"
    ]
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // ممرّ تنظيمي: يضبط namespace لو كان غير مذكور في بعض مكتبات الطرف الثالث
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
