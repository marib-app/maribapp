pluginManagement {
    def flutterSdkPath = {
        def p = new Properties()
        file("local.properties").withInputStream { p.load(it) }
        def path = p.getProperty("flutter.sdk")
        assert path != null : "flutter.sdk not set in local.properties"
        return path
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    // Android Gradle Plugin (حدّثناه)
    id "com.android.application" version "8.7.3" apply false
    id "com.android.library"    version "8.7.3" apply false

    // Kotlin Gradle Plugin (حدّثناه)
    id "org.jetbrains.kotlin.android" version "2.1.10" apply false

    // Google services (كما هو)
    id "com.google.gms.google-services" version "4.4.2" apply false
}


include(":app")
