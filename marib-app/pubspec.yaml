  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  # بقية المكتبات

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animations: ^2.0.11
  firebase_core: ^3.6.0
  firebase_auth: ^5.2.0
  firebase_messaging: ^15.1.3
  flick_video_player: ^0.9.0
  youtube_player_flutter: ^9.1.1
  country_picker: ^2.0.26
  connectivity_plus: ^6.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.6.0
  image_picker: ^1.1.2
  file_picker: ^8.1.3 #^8.0.7
  flutter_bloc: ^8.1.6
