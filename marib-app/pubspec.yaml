  sign_in_with_apple: ^6.1.1
  geolocator: ^13.0.1
  flutter_svg: ^2.0.17
  #uni_links: ^0.5.1
  #google_maps_webservice: ^0.0.19
  google_mobile_ads: ^5.2.0
  flutter_image_compress: ^2.3.0
  google_maps_flutter: ^2.9.0
  vibration: ^2.0.0
  device_region: ^1.4.0
  flutter_pdfview: ^1.3.2
  app_links: ^6.3.1
  change_app_package_name: ^1.3.0
  video_player: ^2.9.1
  path: ^1.9.0


  in_app_purchase: ^3.2.0 #^3.2.0
  #flutter_paystack: ^1.0.7
  device_info_plus: ^11.1.0
  sms_autofill: ^2.4.0
  webview_flutter: ^4.9.0
  flutter_widget_from_html: ^0.15.2
  intl: 0.20.2
  concentric_transition: ^1.0.3
  pinput: ^5.0.1
  color_thief_dart: ^0.1.0
  image: ^4.0.17
  flutter_staggered_grid_view: ^0.7.0
  qr_flutter: ^4.1.0
  marquee: ^2.2.3
  smooth_page_indicator: ^1.2.0+3
  timeago: ^3.7.0
  font_awesome_flutter: 10.7.0

  dropdown_search: 5.0.6
  photo_view: 0.14.0
  flutter_linkify: ^6.0.0
  equatable: 2.0.5
  infinite_scroll_pagination: ^4.0.0
  shared_preferences: ^2.2.3

dependency_overrides:

  # (اختياري) منع الرجوع لنسخة record_linux القديمة التي سببت startStream
  record_linux: ^1.1.0
  # ملاحظة: لا نضع أي قيود على record_platform_interface حتى لا يظهر خطأ "doesn't match any versions"

dev_dependencies:
  rename: ^3.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.3


flutter:

  uses-material-design: true

  assets:
    - assets/svg/
    - assets/image/
    - assets/sections/
    - assets/category/
    - assets/svg/bottomnav/
    - assets/languages/
    - assets/lottie/
    - assets/chat_background/
    - assets/svg/Logo/
    # - assets/svg/Illustrators/
    - assets/svg/payment/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 600
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 700
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 500
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
